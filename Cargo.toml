[package]
name = "twitchdrops_miner"
version = "1.0.9"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
twitch-gql-rs = { git = "https://github.com/this-is-really/twitch-gql-rs" }
dialoguer = "0.12.0"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono"] }
indicatif = "0.18.6"
tracing-appender = "0.2.5"
auto-launch = "0.6.0"
rand = "0.10.3"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
overflow-checks = false
